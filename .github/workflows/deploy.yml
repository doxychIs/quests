name: Проверка и сборка сайта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить TypeScript
        run: npm run check
      - name: Собрать сайт для проверок
        run: npm run build
      - name: Проверить сайт и взаимодействия
        run: npm test
      - name: Собрать версию для портфолио
        run: npm run build
        env:
          SITE_URL: https://doxychis.github.io
          BASE_PATH: /quests/
      - name: Сохранить готовый сайт
        uses: actions/upload-artifact@v4
        with:
          name: quests-site
          path: dist/
          retention-days: 7
